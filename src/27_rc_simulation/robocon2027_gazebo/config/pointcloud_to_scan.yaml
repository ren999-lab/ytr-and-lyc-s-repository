pointcloud_to_laserscan:
  ros__parameters:
    # 在车体坐标系按高度过滤，保留台体侧面和 0.1 m 高的外边栏。
    # 轮心接地后约 z=0.06；该过滤窗的世界高度约 0.07~0.61 m。
    # 同时以 base_link 为投影原点，处理雷达前移 0.12 m 的安装偏置。
    target_frame: base_link
    transform_tolerance: 0.1
    queue_size: 10
    min_height: 0.01
    max_height: 0.55
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.008726646259971648
    scan_time: 0.1
    range_min: 0.3
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0